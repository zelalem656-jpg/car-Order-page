<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የተሽከርካሪ ማዘዣ እና ክፍያ ገጽ</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans p-4 md:p-8">

    <div class="max-w-5xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden grid grid-cols-1 md:grid-cols-2">
        
        <div class="p-6 md:p-8 bg-gray-50 flex flex-col justify-between">
            <div>
                <span class="bg-green-100 text-green-800 text-xs font-semibold px-3 py-1 rounded-full">ጅግጅጋ - ሶማሌ ክልል |🚚 ማድረስ እንችላለን</span>
                <h2 class="text-2xl font-bold text-gray-800 mt-3 mb-4">የተሽከርካሪ ማዘዣ</h2>

                <label class="block text-sm font-medium text-gray-700 mb-1">የሚፈልጉትን ተሽከርካሪ ይምረጡ</label>
                <select id="vehicleSelect" onchange="updateVehicleDetails()" class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 mb-6 bg-white">
                    <option value="2500000">2025 ኤሌክትሪክ መኪና (EV) - 2,500,000 ብር</option>
                    <option value="4200000">Toyota HiRoof Van - 4,200,000 ብር</option>
                    <option value="1800000">Wuling Electric Van - 1,800,000 ብር</option>
                    <option value="250000">Boxer Motorbike - 250,000 ብር</option>
                    <option value="180000">Hapapach / Saykl Motor - 180,000 ብር</option>
                </select>

                <div class="bg-white p-4 rounded-xl border border-gray-200 space-y-3">
                    <div class="flex justify-between text-gray-600">
                        <span>ጠቅላላ ዋጋ፡</span>
                        <span id="totalPrice" class="font-bold text-gray-800">2,500,000 ብር</span>
                    </div>
                    <div class="flex justify-between text-gray-600">
                        <span>ቅድመ ክፍያ (20%)፡</span>
                        <span id="downPayment" class="font-semibold text-blue-600">500,000 ብር</span>
                    </div>
                    <div class="flex justify-between text-gray-600">
                        <span>በባንክ ብድር (80%)፡</span>
                        <span id="bankLoan" class="font-semibold text-green-600">2,000,000 ብር</span>
                    </div>
                </div>
            </div>
            <p class="text-xs text-gray-400 mt-6">* የባንክ ብድር ሂደቶች እንደ ባንኩ ደንብ ይተገበራሉ።</p>
        </div>

        <div class="p-6 md:p-8">
            <h3 class="text-xl font-bold text-gray-800 mb-4">የደንበኛ መረጃ እና ክፍያ</h3>
            <form class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ሙሉ ስም</label>
                    <input type="text" placeholder="አበበ በላቸው" required class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ስልክ ቁጥር</label>
                    <input type="tel" placeholder="0911223344" required class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">የሚረከቡበት ቦታ/ከተማ</label>
                    <input type="text" placeholder="ለምሳሌ፡ ጅግጅጋ፣ አዲስ አበባ..." required class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">የቅድመ ክፍያ መንገድ</label>
                    <select class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        <option>Telebirr (ቴሌብር)</option>
                        <option>CBE Birr (የኢትዮጵያ ንግድ ባንክ)</option>
                        <option>CBE Direct Bank Transfer</option>
                        <option>Awash Bank / Hibret Bank</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition duration-200 mt-2">
                    ትዕዛዙን አረጋግጥ (ቅድመ ክፍያ ፈጽም)
                </button>
            </form>
        </div>

    </div>

    <script>
        function updateVehicleDetails() {
            const select = document.getElementById("vehicleSelect");
            const price = parseFloat(select.value);
            const downPayment = price * 0.20;
            const loan = price - downPayment;

            document.getElementById("totalPrice").innerText = price.toLocaleString() + " ብር";
            document.getElementById("downPayment").innerText = downPayment.toLocaleString() + " ብር";
            document.getElementById("bankLoan").innerText = loan.toLocaleString() + " ብር";
        }
    </script>
</body>
</html>
