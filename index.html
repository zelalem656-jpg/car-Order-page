<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>East Africa Premium Motors</title>
    <!-- ማራኪ ፊደላትን ለመጠቀም -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #f97316; /* ማራኪ ብርቱካናማ */
            --primary-dark: #ea580c;
            --dark: #0f172a;
            --light-bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #334155;
            --text-light: #64748b;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--light-bg); color: var(--text-main); }

        /* 🌟 Navbar */
        .navbar { position: fixed; top: 0; width: 100%; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; z-index: 100; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .logo { font-size: 22px; font-weight: 900; color: var(--dark); text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .logo span { color: var(--primary); }
        .btn-admin-nav { background: var(--dark); color: white; border: none; padding: 8px 20px; border-radius: 30px; font-weight: 500; cursor: pointer; transition: 0.3s; }
        .btn-admin-nav:hover { background: var(--primary); }

        /* 🌟 Hero Section (ማራኪ የፊት ገጽ) */
        .hero { margin-top: 60px; background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); padding: 80px 5%; text-align: center; color: white; border-radius: 0 0 40px 40px; box-shadow: var(--shadow); }
        .hero h1 { font-size: 38px; font-weight: 900; margin-bottom: 15px; line-height: 1.2; }
        .hero p { font-size: 16px; color: #cbd5e1; margin-bottom: 30px; max-width: 600px; margin-inline: auto; }
        
        /* 🌟 Search & Filter Box */
        .search-container { max-width: 900px; margin: -30px auto 40px; background: white; padding: 20px; border-radius: 20px; box-shadow: var(--shadow); display: flex; gap: 15px; flex-wrap: wrap; position: relative; z-index: 10; }
        .search-container input, .search-container select { flex: 1; min-width: 200px; padding: 15px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 15px; outline: none; transition: 0.3s; }
        .search-container input:focus, .search-container select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.2); }

        /* 🌟 Car Cards Grid */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 5% 50px; }
        .section-title { font-size: 24px; font-weight: 700; color: var(--dark); margin-bottom: 25px; display: flex; align-items: center; gap: 10px; }
        .section-title::before { content: ""; width: 8px; height: 25px; background: var(--primary); border-radius: 10px; }
        
        .car-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .car-card { background: var(--card-bg); border-radius: 20px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); transition: all 0.3s ease; border: 1px solid #f1f5f9; position: relative; }
        .car-card:hover { transform: translateY(-10px); box-shadow: var(--shadow); }
        .badge-premium { position: absolute; top: 15px; left: 15px; background: rgba(15, 23, 42, 0.8); color: white; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; backdrop-filter: blur(5px); }
        .car-img { width: 100%; height: 200px; object-fit: cover; }
        .car-content { padding: 20px; }
        .car-name { font-size: 18px; font-weight: 700; color: var(--dark); margin-bottom: 8px; }
        .car-type { font-size: 13px; color: var(--text-light); text-transform: uppercase; letter-spacing: 1px; font-weight: 500; margin-bottom: 15px; display: inline-block; background: #f1f5f9; padding: 4px 10px; border-radius: 8px; }
        .car-price { font-size: 22px; font-weight: 900; color: var(--primary); margin-bottom: 20px; }
        .btn-order { width: 100%; background: linear-gradient(to right, var(--primary), var(--primary-dark)); color: white; border: none; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-order:hover { box-shadow: 0 10px 15px -3px rgba(249, 115, 22, 0.4); }

        /* 🌟 Admin Dashboard */
        .admin-section { display: none; margin-top: 80px; }
        .admin-header { background: white; padding: 25px; border-radius: 20px; box-shadow: var(--shadow); margin-bottom: 30px; }
        .tab-menu { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px; }
        .tab-btn { background: #f1f5f9; border: none; padding: 12px 25px; border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.3s; color: var(--text-light); white-space: nowrap; }
        .tab-btn.active { background: var(--dark); color: white; }
        
        .table-container { background: white; border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; padding: 20px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th { background: #f8fafc; color: var(--text-light); font-weight: 600; text-transform: uppercase; font-size: 13px; letter-spacing: 0.5px; padding: 15px; border-bottom: 2px solid #e2e8f0; text-align: left; }
        td { padding: 15px; border-bottom: 1px solid #f1f5f9; font-size: 14px; color: var(--dark); vertical-align: middle; }
        .td-img { width: 60px; height: 45px; border-radius: 8px; object-fit: cover; }
        
        .status-badge { padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .bg-pending { background: #fef3c7; color: #d97706; }
        .bg-approved { background: #dcfce7; color: #15803d; }
        
        .action-btn { border: none; padding: 8px 12px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 12px; transition: 0.2s; }
        .btn-add { background: #10b981; color: white; padding: 12px 25px; border-radius: 12px; font-weight: 700; margin-bottom: 20px; display: inline-flex; border: none; cursor: pointer; }

        /* 🌟 Modals (Popup) */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(5px); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; opacity: 0; transition: opacity 0.3s; }
        .modal.show { opacity: 1; }
        .modal-content { background: white; padding: 30px; border-radius: 24px; width: 100%; max-width: 450px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); transform: translateY(20px); transition: 0.3s; }
        .modal.show .modal-content { transform: translateY(0); }
        .modal-title { font-size: 22px; font-weight: 800; color: var(--dark); margin-bottom: 20px; }
        
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-light); margin-bottom: 5px; }
        .input-group input, .input-group select { width: 100%; padding: 14px; border: 1px solid #e2e8f0; border-radius: 12px; background: #f8fafc; font-size: 14px; outline: none; }
        .input-group input:focus, .input-group select:focus { border-color: var(--primary); background: white; }
        
        .modal-actions { display: flex; gap: 10px; margin-top: 25px; }
        .btn-cancel { flex: 1; background: #f1f5f9; color: var(--text-main); border: none; padding: 14px; border-radius: 12px; font-weight: 600; cursor: pointer; }
        .btn-confirm { flex: 2; background: var(--dark); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 700; cursor: pointer; }

        /* Price Breakdown in Modal */
        .price-breakdown { background: #f8fafc; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px dashed #cbd5e1; }
        .price-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        .price-row.total { font-weight: 800; color: var(--primary); border-top: 1px solid #e2e8f0; padding-top: 8px; margin-top: 8px; font-size: 16px; }
    </style>
</head>
<body>

    <!-- 🌟 NAVBAR -->
    <nav class="navbar">
        <a href="#" class="logo" onclick="toggleView(false)">🚗 EA <span>Motors</span></a>
        <button class="btn-admin-nav" onclick="toggleView(true)" id="navAdminBtn">Admin Login</button>
    </nav>

    <!-- ========================================== -->
    <!-- 🌟 CUSTOMER VIEW (የደንበኛ ገጽ)              -->
    <!-- ========================================== -->
    <div id="customerView">
        <!-- Hero Section -->
        <div class="hero">
            <h1>የህልምዎን መኪና<br>በቀላሉ ያግኙ</h1>
            <p>በምስራቅ አፍሪካ ታማኝ እና ፈጣን የመኪና አቅርቦት። የሚፈልጉትን መርጠው በቅድመ ክፍያ ያዙ።</p>
        </div>

        <!-- Search Box -->
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="መኪና በስም ይፈልጉ..." onkeyup="filterCars()">
            <select id="typeFilter" onchange="filterCars()">
                <option value="">ሁሉም ዓይነት (All Types)</option>
                <option value="SUV">SUV</option>
                <option value="Sedan">Sedan</option>
                <option value="Van">Van</option>
                <option value="EV">Electric (EV)</option>
            </select>
            <select id="priceFilter" onchange="filterCars()">
                <option value="">ማንኛውም ዋጋ</option>
                <option value="3000000">ከ 3,000,000 ብር በታች</option>
                <option value="5000000">ከ 5,000,000 ብር በታች</option>
            </select>
        </div>

        <!-- Car Grid -->
        <div class="container">
            <h2 class="section-title">በስቶክ ያሉ ተሽከርካሪዎች</h2>
            <div class="car-grid" id="carGrid">
                <!-- Cars will load here -->
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- ⚙️ ADMIN VIEW (የአድሚን ገጽ)                 -->
    <!-- ========================================== -->
    <div class="container admin-section" id="adminView">
        <div class="admin-header">
            <h2 class="section-title" style="margin-bottom: 20px;">የአድሚን ዳሽቦርድ</h2>
            <div class="tab-menu">
                <button class="tab-btn active" onclick="switchTab('tabCars', this)">🚗 መኪኖች (Stock)</button>
                <button class="tab-btn" onclick="switchTab('tabOrders', this)">📋 ትዕዛዞች (Orders)</button>
            </div>
        </div>

        <!-- TAB: Cars -->
        <div id="tabCars">
            <button class="btn-add" onclick="openModal('addCarModal')">➕ አዲስ መኪና መዝግብ</button>
            <div class="table-container">
                <table>
                    <thead>
                        <tr><th>ፎቶ</th><th>መኪና</th><th>ዓይነት</th><th>ዋጋ</th><th>እርምጃ</th></tr>
                    </thead>
                    <tbody id="adminCarsBody"></tbody>
                </table>
            </div>
        </div>

        <!-- TAB: Orders -->
        <div id="tabOrders" style="display: none;">
            <div class="table-container">
                <table>
                    <thead>
                        <tr><th>ደንበኛ</th><th>ስልክ</th><th>የታዘዘው መኪና</th><th>ከተማ</th><th>ሁኔታ</th><th>እርምጃ</th></tr>
                    </thead>
                    <tbody id="adminOrdersBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 🪟 MODALS (ፖፕ አፖች)                        -->
    <!-- ========================================== -->
    
    <!-- 1. Login Modal -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <h3 class="modal-title">🔑 አድሚን መግቢያ</h3>
            <div class="input-group">
                <label>የይለፍ ቃል (PIN: 1234)</label>
                <input type="password" id="adminPin" placeholder="****">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal('loginModal')">ሰርዝ</button>
                <button class="btn-confirm" onclick="verifyLogin()">ግባ</button>
            </div>
        </div>
    </div>

    <!-- 2. Order Modal -->
    <div class="modal" id="orderModal">
        <div class="modal-content">
            <h3 class="modal-title" id="orderModalTitle">ትዕዛዝ ማረጋገጫ</h3>
            
            <div class="price-breakdown">
                <div class="price-row"><span>ቅድመ ክፍያ (20%):</span> <span id="mdlDown"></span></div>
                <div class="price-row"><span>የባንክ ብድር (80%):</span> <span id="mdlLoan"></span></div>
                <div class="price-row total"><span>ጠቅላላ ዋጋ:</span> <span id="mdlTotal"></span></div>
            </div>

            <form onsubmit="submitOrder(event)">
                <input type="hidden" id="orderCarId">
                <div class="input-group">
                    <input type="text" id="ordName" placeholder="ሙሉ ስም" required>
                </div>
                <div class="input-group">
                    <input type="tel" id="ordPhone" placeholder="ስልክ ቁጥር" required>
                </div>
                <div class="input-group">
                    <input type="text" id="ordCity" placeholder="የሚረከቡበት ከተማ" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal('orderModal')">ተመለስ</button>
                    <button type="submit" class="btn-confirm" style="background: var(--primary);">ትዕዛዝ ላክ</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 3. Add Car Modal -->
    <div class="modal" id="addCarModal">
        <div class="modal-content">
            <h3 class="modal-title">አዲስ መኪና መዝግብ</h3>
            <form onsubmit="addCar(event)">
                <div class="input-group">
                    <label>የመኪና ስም</label>
                    <input type="text" id="cName" placeholder="Toyota Hilux..." required>
                </div>
                <div class="input-group">
                    <label>ዋጋ (በብር)</label>
                    <input type="number" id="cPrice" placeholder="5000000" required>
                </div>
                <div class="input-group">
                    <label>የመኪና ዓይነት</label>
                    <select id="cType">
                        <option value="SUV">SUV</option><option value="Sedan">Sedan</option>
                        <option value="Van">Van</option><option value="EV">EV</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>የፎቶ ሊንክ (አማራጭ)</label>
                    <input type="text" id="cImg" placeholder="https://image-url...">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal('addCarModal')">ሰርዝ</button>
                    <button type="submit" class="btn-confirm" style="background: #10b981;">መዝግብ</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- ⚙️ JAVASCRIPT LOGIC                       -->
    <!-- ========================================== -->
    <script>
        // Database Initialization
        const defaultCars = [
            { id: 1, name: 'Toyota Land Cruiser 2024', price: 9500000, type: 'SUV', img: 'https://images.unsplash.com/photo-1568605117036-5fe5e7bab0b7?w=600&q=80' },
            { id: 2, name: 'Kia Sportage GT Line', price: 4200000, type: 'SUV', img: 'https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?w=600&q=80' },
            { id: 3, name: 'Hyundai Elantra 2023', price: 3100000, type: 'Sedan', img: 'https://images.unsplash.com/photo-1560958089-b8a1929cea89?w=600&q=80' },
            { id: 4, name: 'Toyota Hiace High-Roof', price: 4800000, type: 'Van', img: 'https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=600&q=80' }
        ];

        let dbCars = JSON.parse(localStorage.getItem('ea_cars')) || defaultCars;
        let dbOrders = JSON.parse(localStorage.getItem('ea_orders')) || [];
        let isLoggedIn = false;

        function syncDB() {
            localStorage.setItem('ea_cars', JSON.stringify(dbCars));
            localStorage.setItem('ea_orders', JSON.stringify(dbOrders));
            renderCustomerGrid();
            renderAdminTables();
        }

        // --- Core UI Functions ---
        function renderCustomerGrid(filtered = dbCars) {
            const grid = document.getElementById('carGrid');
            grid.innerHTML = '';
            
            if(filtered.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #64748b; padding: 40px;">ምንም መኪና አልተገኘም!</p>';
                return;
            }

            filtered.forEach(car => {
                grid.innerHTML += `
                    <div class="car-card">
                        <div class="badge-premium">⭐ Available</div>
                        <img src="${car.img}" class="car-img" alt="${car.name}">
                        <div class="car-content">
                            <span class="car-type">${car.type}</span>
                            <h3 class="car-name">${car.name}</h3>
                            <div class="car-price">${Number(car.price).toLocaleString()} ብር</div>
                            <button class="btn-order" onclick="openOrder(${car.id})">አሁን ይዘዙ (Order Now)</button>
                        </div>
                    </div>
                `;
            });
        }

        function filterCars() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const type = document.getElementById('typeFilter').value;
            const maxPrice = parseFloat(document.getElementById('priceFilter').value) || Infinity;

            const res = dbCars.filter(c => 
                c.name.toLowerCase().includes(term) && 
                (type === '' || c.type === type) && 
                c.price <= maxPrice
            );
            renderCustomerGrid(res);
        }

        // --- Modals ---
        function openModal(id) { 
            const m = document.getElementById(id);
            m.style.display = 'flex';
            setTimeout(() => m.classList.add('show'), 10);
        }
        function closeModal(id) {
            const m = document.getElementById(id);
            m.classList.remove('show');
            setTimeout(() => m.style.display = 'none', 300);
        }

        // --- Order Logic ---
        function openOrder(id) {
            const car = dbCars.find(c => c.id === id);
            document.getElementById('orderCarId').value = car.id;
            document.getElementById('orderModalTitle').innerText = car.name;
            
            const down = car.price * 0.2;
            document.getElementById('mdlTotal').innerText = car.price.toLocaleString() + ' ብር';
            document.getElementById('mdlDown').innerText = down.toLocaleString() + ' ብር';
            document.getElementById('mdlLoan').innerText = (car.price - down).toLocaleString() + ' ብር';
            
            openModal('orderModal');
        }

        function submitOrder(e) {
            e.preventDefault();
            const car = dbCars.find(c => c.id == document.getElementById('orderCarId').value);
            dbOrders.unshift({
                id: Date.now(),
                car: car.name,
                name: document.getElementById('ordName').value,
                phone: document.getElementById('ordPhone').value,
                city: document.getElementById('ordCity').value,
                status: 'Pending'
            });
            syncDB();
            closeModal('orderModal');
            alert('🎉 ትዕዛዝዎ በተሳካ ሁኔታ ተልኳል!');
            e.target.reset();
        }

        // --- Admin Logic ---
        function toggleView(forceAdmin) {
            if(forceAdmin && !isLoggedIn) {
                openModal('loginModal');
            } else if (forceAdmin && isLoggedIn) {
                document.getElementById('customerView').style.display = 'none';
                document.getElementById('adminView').style.display = 'block';
                document.getElementById('navAdminBtn').innerText = 'ውጣ (Logout)';
            } else {
                isLoggedIn = false;
                document.getElementById('customerView').style.display = 'block';
                document.getElementById('adminView').style.display = 'none';
                document.getElementById('navAdminBtn').innerText = 'Admin Login';
            }
        }

        function verifyLogin() {
            if(document.getElementById('adminPin').value === '1234') {
                isLoggedIn = true;
                closeModal('loginModal');
                toggleView(true);
            } else {
                alert('የተሳሳተ PIN ነው!');
            }
            document.getElementById('adminPin').value = '';
        }

        function switchTab(tabId, btn) {
            document.getElementById('tabCars').style.display = 'none';
            document.getElementById('tabOrders').style.display = 'none';
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).style.display = 'block';
            btn.classList.add('active');
        }

        function renderAdminTables() {
            // Cars
            const cBody = document.getElementById('adminCarsBody');
            cBody.innerHTML = '';
            dbCars.forEach((c, i) => {
                cBody.innerHTML += `<tr>
                    <td><img src="${c.img}" class="td-img"></td>
                    <td><strong>${c.name}</strong></td>
                    <td>${c.type}</td>
                    <td>${Number(c.price).toLocaleString()} ብር</td>
                    <td><button class="action-btn" style="background:#fee2e2; color:#dc2626;" onclick="delCar(${i})">🗑️</button></td>
                </tr>`;
            });

            // Orders
            const oBody = document.getElementById('adminOrdersBody');
            oBody.innerHTML = '';
            dbOrders.forEach((o, i) => {
                const badge = o.status === 'Pending' ? 'bg-pending' : 'bg-approved';
                oBody.innerHTML += `<tr>
                    <td><strong>${o.name}</strong></td>
                    <td>${o.phone}</td>
                    <td>${o.car}</td>
                    <td>${o.city}</td>
                    <td><span class="status-badge ${badge}">${o.status}</span></td>
                    <td>
                        <button class="action-btn" style="background:#e0f2fe; color:#0284c7; margin-right:5px;" onclick="updOrder(${i})">ቀይር</button>
                        <button class="action-btn" style="background:#fee2e2; color:#dc2626;" onclick="delOrder(${i})">🗑️</button>
                    </td>
                </tr>`;
            });
        }

        function addCar(e) {
            e.preventDefault();
            dbCars.unshift({
                id: Date.now(),
                name: document.getElementById('cName').value,
                price: document.getElementById('cPrice').value,
                type: document.getElementById('cType').value,
                img: document.getElementById('cImg').value || 'https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?w=600&q=80'
            });
            syncDB();
            closeModal('addCarModal');
            e.target.reset();
        }

        function delCar(i) { if(confirm('መኪናውን ያጥፉት?')) { dbCars.splice(i, 1); syncDB(); } }
        function updOrder(i) { dbOrders[i].status = dbOrders[i].status === 'Pending' ? 'Approved' : 'Pending'; syncDB(); }
        function delOrder(i) { if(confirm('ትዕዛዙን ያጥፉት?')) { dbOrders.splice(i, 1); syncDB(); } }

        // Start App
        syncDB();
    </script>
</body>
</html>
